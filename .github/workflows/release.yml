name: Release
on:
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  release:
    runs-on: 'ubuntu-latest'
    name: Release
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    steps:
    - id: sha
      run: |
        sha="${{github.sha}}"
        echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
    - name: Release
      uses: nu12/templates/actions/github/release/v1@main
      with:
        version: ${{ steps.sha.outputs.short }}

  linux-amd64:
    needs: [release]
    runs-on: 'ubuntu-latest'
    name: Build (linux-amd64)
    steps:
    - run: |
        sudo apt update && sudo apt install libwayland-dev libxkbcommon-dev libxcursor-dev libx11-dev libxrandr-dev libxinerama-dev libxi-dev libegl1-mesa-dev libxxf86vm-dev -y
    - name: Build and Release
      uses: nu12/templates/jobs/build-and-release/go/v1@main
      with:
        go-version: '1.26.3'
        go-main: 'main.go bundled.go'
        name: 'kvm'
        platform: 'linux-amd64'
        release-name: ${{ needs.release.outputs.sha }}

  win-amd64:
    needs: [release]
    runs-on: "windows-latest"
    name: Build (win-amd64)
    steps:
    - name: Build and Release
      uses: nu12/templates/jobs/build-and-release/go/v1@main
      with:
        go-version: '1.26.3'
        go-main: 'main.go bundled.go'
        name: 'kvm'
        name-extention: '.exe'
        platform: 'win-amd64'
        zip-util: '7z'
        release-name: ${{ needs.release.outputs.sha }}

  darwin-amd64:
    needs: [release]
    runs-on: "macos-15"
    name: Build (darwin-amd64)
    steps:
    - name: Build and Release
      uses: nu12/templates/jobs/build-and-release/go/v1@main
      with:
        go-version: '1.26.3'
        go-main: 'main.go bundled.go'
        name: 'kvm'
        platform: 'darwin-amd64'
        release-name: ${{ needs.release.outputs.sha }}
  
  darwin-arm64:
    needs: [release]
    runs-on: 'macos-latest'
    name: Build (darwin-arm64)
    steps:
    - name: Build and Release
      uses: nu12/templates/jobs/build-and-release/go/v1@main
      with:
        go-version: '1.26.3'
        go-main: 'main.go bundled.go'
        name: 'kvm'
        platform: 'darwin-arm64'
        release-name: ${{ needs.release.outputs.sha }}
